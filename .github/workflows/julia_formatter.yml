name: JuliaFormatter
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      # Pinned: the committed source is formatted with this exact version (verified
      # byte-identical to its output). Bump deliberately and re-run `format(".")` locally
      # before merging, so CI and contributors stay in sync. See PR #4 for the skew this fixes.
      - run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2.10.0")'
      - run: julia -e 'using JuliaFormatter; format(".", verbose=true)'
      - name: Check formatting diff
        run: |
          git diff --color=always --exit-code
